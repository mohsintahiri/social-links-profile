<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="profile-card">
    <img class="profile-picture" src="./assets/images/avatar-mohsin.png" alt="User profile picture in which he appears smiling">

      <span class="user-location">Madrid, Spain</span>

    <nav class="social-links-container">
      <a class="social-link" href="https://github.com/mohsintahiri/" target="_blank">GitHub</a>
      <a class="social-link" href="https://www.frontendmentor.io/profile/mohsintahiri" target="_blank">Frontend Mentor</a>
      <a class="social-link" href="https://www.linkedin.com/in/mohsin-tahiri-amankour-a792a6333/" target="_blank">LinkedIn</a>
      <a class="social-link" href="#">Twitter</a>
      <a class="social-link" href="#">Instagram</a>
    </nav>
  </main>
</body>
</html>
